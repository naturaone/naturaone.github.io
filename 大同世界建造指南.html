<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大同世界建造指南 · 世界民生中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
        }

        .header-back {
            position: absolute;
            left: 24px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.5s ease;
        }

        .header-back:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .header-home {
            position: absolute;
            right: 24px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.5s ease;
        }

        .header-home:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .page-header {
            text-align: center;
            padding: 90px 20px 10px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #584267;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(88, 66, 103, 0.3);
            margin: 20px auto;
        }

        .article-content {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 24px 50px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .article-content p {
            font-size: 1.05rem;
            line-height: 2.3;
            color: #4a3558;
            margin-bottom: 1.5em;
            text-align: justify;
        }

        .back-section {
            text-align: center;
            padding: 10px 20px 20px;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-block;
            color: #584267;
            text-decoration: none;
            border: 1px solid rgba(88, 66, 103, 0.4);
            padding: 10px 30px;
            letter-spacing: 2px;
            transition: all 0.5s ease;
            margin: 0 8px;
        }

        .back-link:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .block-four {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(
                to bottom,
                #665078 0%,
                #584267 60%,
                #4a3558 100%
            );
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
        }

        .back-to-top {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(88, 66, 103, 0.2);
            border: 1px solid rgba(88, 66, 103, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .back-to-top:hover {
            background: rgba(88, 66, 103, 0.35);
        }

        .back-to-top span {
            display: block;
            width: 8px;
            height: 8px;
            border-left: 1.5px solid #584267;
            border-top: 1.5px solid #584267;
            transform: rotate(45deg);
            margin-top: 3px;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.5rem;
            }
            .article-content {
                padding: 16px 18px 40px;
                max-width: 100%;
            }
            .article-content p {
                font-size: 1rem;
                line-height: 2.1;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="世界民生中心.html" class="header-back">← 返回</a>
        <img class="header-logo" src="tusita.png" alt="Tusita">
        <a href="知足天.html" class="header-home">首頁</a>
    </header>

    <div class="page-header">
        <h1>大同世界建造指南</h1>
        <div class="divider"></div>
    </div>

    <div class="article-content" id="articleContent">
        <p>載入中……</p>
    </div>

    <div class="back-section">
        <a href="世界民生中心.html" class="back-link">← 返回</a>
        <a href="知足天.html" class="back-link">首頁</a>
    </div>

    <footer class="block-four">
        <p class="copyright">© 2023-2026 白頭翁</p>
    </footer>

    <div class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <span></span>
    </div>

    <img src="文章背景.png" alt="" style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 60vw; max-width: 400px; object-fit: contain; opacity: 0.05; pointer-events: none; z-index: 0;">

    <script>
        fetch('大同世界建造指南-article.txt')
            .then(response => {
                if (!response.ok) throw new Error('文章載入失敗');
                return response.text();
            })
            .then(text => {
                const container = document.getElementById('articleContent');
                container.innerHTML = '';
                const lines = text.split('\n');
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed === '') {
                        const spacer = document.createElement('div');
                        spacer.style.cssText = 'height: 1.5em;';
                        container.appendChild(spacer);
                        return;
                    }
                    if (trimmed.startsWith('## ')) {
                        const h2 = document.createElement('h2');
                        h2.textContent = trimmed.replace('## ', '').trim();
                        h2.style.cssText = 'font-size: 1.3rem; font-weight: 350; letter-spacing: 2px; color: #584267; margin: 2em 0 0.8em; text-align: center;';
                        container.appendChild(h2);
                    }
                    else if (trimmed.startsWith('### ')) {
                        const h3 = document.createElement('h3');
                        h3.textContent = trimmed.replace('### ', '').trim();
                        h3.style.cssText = 'font-size: 1.1rem; font-weight: 340; letter-spacing: 1.5px; color: #6b5580; margin: 1.5em 0 0.6em; text-align: center;';
                        container.appendChild(h3);
                    }
                    else {
                        const p = document.createElement('p');
                        p.textContent = trimmed;
                        container.appendChild(p);
                    }
                });
            })
            .catch(error => {
                document.getElementById('articleContent').innerHTML = 
                    '<p>文章載入失敗，請稍後再試。</p>';
                console.error(error);
            });

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
