<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知足天律 · 一二三四五</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #584267;
            color: #dcd5e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px 10px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(180, 165, 200, 0.5);
            margin: 20px auto;
        }

        .article-content {
            flex: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 24px 50px;
            text-align: left;
        }

        .article-content p {
            font-size: 1.05rem;
            line-height: 2.1;
            color: #d0c8dd;
            margin-bottom: 1.5em;
            text-align: justify;
        }

        .back-section {
            text-align: center;
            padding: 10px 20px 20px;
        }

        .back-link {
            display: inline-block;
            color: #dcd5e0;
            text-decoration: none;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 10px 30px;
            letter-spacing: 2px;
            transition: all 0.5s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.15);
        }

        .block-four {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(60, 45, 78, 0.7);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.5rem;
            }
            .article-content {
                padding: 16px 18px 40px;
            }
            .article-content p {
                font-size: 1rem;
                line-height: 1.9;
            }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>知足天律</h1>
        <div class="divider"></div>
    </div>

    <div class="article-content" id="articleContent">
        <p>載入中……</p>
    </div>

    <div class="back-section">
        <a href="index.html" class="back-link">← 返回</a>
    </div>

    <footer class="block-four">
        <p class="copyright">© 2025 一二三四五 · 版權所有</p>
    </footer>

    <script>
        fetch('left-article.txt')
            .then(response => {
                if (!response.ok) throw new Error('文章載入失敗');
                return response.text();
            })
            .then(text => {
                const container = document.getElementById('articleContent');
                container.innerHTML = '';
                const paragraphs = text.split('\n');
                paragraphs.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed === '') {
                        return;
                    }
                    const p = document.createElement('p');
                    p.textContent = trimmed;
                    container.appendChild(p);
                });
            })
            .catch(error => {
                document.getElementById('articleContent').innerHTML = 
                    '<p>文章載入失敗，請稍後再試。</p>';
                console.error(error);
            });
    </script>
</body>
</html>
