<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心學 · 一二三四五</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #584267;
            color: #dcd5e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            text-align: center;
            padding: 40px 20px 10px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(180, 165, 200, 0.5);
            margin: 20px auto;
        }

        .article-content {
            flex: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 24px 50px;
            text-align: left;
        }

        .article-content p {
            font-size: 1.05rem;
            line-height: 2.1;
            color: #d0c8dd;
            margin-bottom: 1.5em;
            text-align: justify;
        }

        /* ===== 原著資訊（框外上方） ===== */
        .work-info {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .work-info p {
            font-size: 1rem;
            color: #dbd2e6;
            letter-spacing: 3px;
            line-height: 2.2;
            margin-bottom: 0;
        }

        /* ===== 版權聲明區塊（葫蘆形） ===== */
        .license-box {
            margin: 0 auto;
            padding: 30px 25px;
            background: rgba(60, 45, 78, 0.5);
            border: 1px solid rgba(180, 165, 200, 0.25);
            text-align: center;
            max-width: 320px;
        }

        .license-title {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #dbd2e6;
            margin-bottom: 18px;
        }

        .license-text {
            font-size: 0.9rem;
            line-height: 2.6;
            color: #c5bbd4;
            display: inline-block;
            text-align: center;
        }

        /* ===== 勾選區塊 ===== */
        .agree-section {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .agree-section input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #b0a0c0;
            cursor: pointer;
        }

        .agree-section label {
            font-size: 0.85rem;
            color: #d0c8dd;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
        }

        /* ===== 下載按鈕 ===== */
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #dcd5e0;
            text-decoration: none;
            border: 1px solid rgba(180, 165, 200, 0.5);
            background: transparent;
            cursor: default;
            transition: all 0.5s ease;
            opacity: 0.4;
            pointer-events: none;
        }

        .download-btn.active {
            opacity: 1;
            cursor: pointer;
            pointer-events: auto;
        }

        .download-btn.active:hover {
            background: rgba(180, 165, 200, 0.2);
            border-color: rgba(200, 185, 220, 0.7);
        }

        .download-section {
            text-align: center;
        }

        /* ===== 返回連結 ===== */
        .back-section {
            text-align: center;
            padding: 10px 20px 20px;
        }

        .back-link {
            display: inline-block;
            color: #dcd5e0;
            text-decoration: none;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 10px 30px;
            letter-spacing: 2px;
            transition: all 0.5s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.15);
        }

        /* ===== 版權欄 ===== */
        .block-four {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(60, 45, 78, 0.7);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.5rem;
            }
            .article-content {
                padding: 16px 18px 40px;
            }
            .article-content p {
                font-size: 1rem;
                line-height: 1.9;
            }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>心學</h1>
        <div class="divider"></div>
    </div>

    <!-- 文章內容 - 自動載入 middle-article.txt -->
    <div class="article-content" id="articleContent">
        <p>載入中……</p>
    </div>

    <!-- 原著資訊（框外上方） -->
    <div class="work-info">
        <p>《大象通解》<br>二〇二三年版</p>
    </div>

    <!-- 版權聲明（葫蘆形居中） -->
    <div class="license-box">
        <p class="license-title">版權聲明</p>
        <p class="license-text">
            本作品為原著創作<br>
            僅供個人學習使用<br>
            禁止商業用途及轉售<br>
            轉載引用請註明出處<br>
            禁止修改、重製
        </p>
    </div>

    <!-- 勾選同意 + 下載 -->
    <div class="article-content" style="padding-top: 0;">

        <div class="agree-section">
            <input type="checkbox" id="agreeCheckbox" onchange="toggleDownload()">
            <label for="agreeCheckbox">我已閱讀並同意以上版權條款</label>
        </div>

        <div class="download-section">
            <a href="原著作品.pdf" download class="download-btn" id="downloadBtn" onclick="return checkDownload(event)">
                ⬇ 下載原著
            </a>
        </div>
    </div>

    <div class="back-section">
        <a href="index.html" class="back-link">← 返回</a>
    </div>

    <footer class="block-four">
        <p class="copyright">© 2023-2026 白頭翁 · 版權所有</p>
    </footer>

    <script>
        // 載入文章
        fetch('middle-article.txt')
            .then(response => {
                if (!response.ok) throw new Error('文章載入失敗');
                return response.text();
            })
            .then(text => {
                const container = document.getElementById('articleContent');
                container.innerHTML = '';
                const paragraphs = text.split('\n');
                paragraphs.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed === '') {
                        return;
                    }
                    const p = document.createElement('p');
                    p.textContent = trimmed;
                    container.appendChild(p);
                });
            })
            .catch(error => {
                document.getElementById('articleContent').innerHTML = 
                    '<p>文章載入失敗，請稍後再試。</p>';
                console.error(error);
            });

        // 下載按鈕控制
        function toggleDownload() {
            const checkbox = document.getElementById('agreeCheckbox');
            const downloadBtn = document.getElementById('downloadBtn');
            
            if (checkbox.checked) {
                downloadBtn.classList.add('active');
            } else {
                downloadBtn.classList.remove('active');
            }
        }

        function checkDownload(event) {
            const checkbox = document.getElementById('agreeCheckbox');
            if (!checkbox.checked) {
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
