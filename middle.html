<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一二 · 一二三四五</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #584267;
            color: #dcd5e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .content {
            max-width: 600px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
            margin-bottom: 30px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(180, 165, 200, 0.5);
            margin: 30px auto;
        }

        p {
            font-size: 1.1rem;
            line-height: 2;
            color: #d0c8dd;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #dcd5e0;
            text-decoration: none;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 10px 30px;
            letter-spacing: 2px;
            transition: all 0.5s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.15);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>一二</h1>
        <div class="divider"></div>
        <p>
            陰陽相生<br>
            虛實共存<br>
            簡中見繁<br>
            繁中歸簡
        </p>
        <div class="divider"></div>
        <a href="index.html" class="back-link">← 返回</a>
    </div>
</body>
</html>
