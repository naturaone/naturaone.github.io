<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界民生中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .menu-row {
            flex: 1;
            display: flex;
            position: relative;
        }

        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            font-size: 1.3rem;
            letter-spacing: 3px;
            position: relative;
        }

        /* === 完全按照原始世界心學會的設定 === */
        .menu-card:first-child {
            background: rgba(88, 66, 103, 0.04);
            padding-right: 180px;
        }
        .menu-card:first-child:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .menu-card:last-child {
            background: rgba(88, 66, 103, 0.02);
            padding-left: 180px;
        }
        .menu-card:last-child:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        /* === 文字改為絕對定位，與把手完全一致 === */
        .card-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            writing-mode: vertical-rl;
            letter-spacing: 6px;
            font-size: 1.4rem;
            pointer-events: none;
            white-space: nowrap;
        }

        /* 左卡片文字偏移，與把手偏移一致 */
        .menu-card:first-child .card-text {
            left: calc(50% + 90px);
        }

        /* 右卡片文字偏移，與把手偏移一致 */
        .menu-card:last-child .card-text {
            left: calc(50% - 90px);
        }

        /* === 把手完全按照原始設定 === */
        .handle-left {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 540px;
            height: 540px;
            object-fit: contain;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .menu-card:first-child .handle-left {
            left: calc(50% + 90px);
        }

        .menu-card:last-child .handle-left {
            left: calc(50% - 90px);
        }

        .divider-zone {
            width: 1px;
            background: rgba(88, 66, 103, 0.2);
            position: relative;
            z-index: 1;
        }

        .row-divider {
            width: 100%;
            height: 1px;
            background: rgba(88, 66, 103, 0.12);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        /* === 門邊完全按照原始設定 === */
        .left-edge {
            position: absolute;
            left: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .right-edge {
            position: absolute;
            right: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        /* 背景 logo */
        .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vw;
            max-width: 350px;
            max-height: 350px;
            object-fit: contain;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 768px) {
            .menu-card {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .menu-card:first-child {
                padding-right: 50px;
            }
            .menu-card:last-child {
                padding-left: 50px;
            }
            .menu-card:first-child .handle-left {
                left: calc(50% + 40px);
            }
            .menu-card:last-child .handle-left {
                left: calc(50% - 40px);
            }
            .menu-card:first-child .card-text {
                left: calc(50% + 40px);
            }
            .menu-card:last-child .card-text {
                left: calc(50% - 40px);
            }
            .handle-left {
                width: 330px;
                height: 330px;
            }
            .card-text {
                font-size: 1.1rem;
                letter-spacing: 4px;
            }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
            .bg-logo {
                width: 70vw;
                height: 70vw;
            }
            .left-edge {
                max-width: 84vw;
                top: 38%;
            }
            .right-edge {
                max-width: 84vw;
                top: 38%;
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界民生中心</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="bg-logo" src="Tusita-purple.png" alt="Tusita">

        <img class="left-edge" src="左門邊.png" alt="">
        <img class="right-edge" src="右門邊.png" alt="">

        <!-- 第一行 -->
        <div class="menu-row">
            <a href="民生中心.html" class="menu-card">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">民生中心</span>
            </a>
            <div class="divider-zone"></div>
            <a href="統寶.html" class="menu-card">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">統寶</span>
            </a>
        </div>

        <div class="row-divider"></div>

        <!-- 第二行 -->
        <div class="menu-row">
            <a href="心學院.html" class="menu-card">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">心學院</span>
            </a>
            <div class="divider-zone"></div>
            <a href="自然律.html" class="menu-card">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">自然律</span>
            </a>
        </div>

    </div>

        <footer style="padding: 12px 20px; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(to bottom, #665078 0%, #584267 60%, #4a3558 100%); flex-shrink: 0;">
        <p style="font-size: 0.75rem; letter-spacing: 1px; color: #c5bbd4; font-weight: 300; margin: 0;">© 2023-2026 白頭翁</p>
    </footer>
    
</body>
</html>
