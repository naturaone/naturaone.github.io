<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知足天之羽</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 90vw;
            max-width: 700px;
            max-height: 700px;
            object-fit: contain;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .institute-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            position: relative;
            z-index: 1;
        }

        .institute-card.xinxuehui {
            background: rgba(88, 66, 103, 0.04);
            flex-direction: row;
        }
        .institute-card.xinxuehui:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .institute-card.minsheng {
            background: rgba(88, 66, 103, 0.02);
            flex-direction: row-reverse;
        }
        .institute-card.minsheng:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        .institute-name-vertical {
            writing-mode: vertical-rl;
            font-size: 2rem;
            font-weight: 350;
            letter-spacing: 8px;
            color: #584267;
        }

        .institute-subtitle-vertical {
            writing-mode: vertical-rl;
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: #7a6e8a;
            margin-left: 16px;
        }

        .institute-card.minsheng .institute-subtitle-vertical {
            margin-left: 0;
            margin-right: 16px;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            object-fit: contain;
            opacity: 0.35;
            z-index: 2;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .institute-name-vertical {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
            .institute-subtitle-vertical {
                font-size: 0.6rem;
                letter-spacing: 3px;
                margin-left: 10px;
            }
            .institute-card.minsheng .institute-subtitle-vertical {
                margin-right: 10px;
            }
            .center-logo {
                width: 70px;
                height: 70px;
            }
            .bg-logo {
                width: 95vw;
                height: 95vw;
            }
        }
    </style>
</head>
<body>

    <img class="bg-logo" src="Tusita-purple.png" alt="Tusita">

    <a href="世界心學會.html" class="institute-card xinxuehui">
        <span class="institute-name-vertical">世界心學會</span>
        <span class="institute-subtitle-vertical">引護精神</span>
    </a>

    <img class="center-logo" src="Tusita-purple.png" alt="Tusita">

    <a href="世界民生中心.html" class="institute-card minsheng">
        <span class="institute-subtitle-vertical">服務群生</span>
        <span class="institute-name-vertical">世界民生中心</span>
    </a>

</body>
</html>
