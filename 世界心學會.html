<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #584267;
            color: #dcd5e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            background: rgba(60, 45, 78, 0.7);
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 24px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-title {
            font-size: 1.1rem;
            font-weight: 350;
            letter-spacing: 3px;
            color: #dbd2e6;
        }

        .menu-body {
            flex: 1;
            display: flex;
        }

        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #e0d8ec;
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        .menu-card:first-child {
            background: rgba(120, 105, 140, 0.45);
        }
        .menu-card:first-child:hover {
            background: rgba(130, 115, 150, 0.55);
        }

        .menu-card:last-child {
            background: rgba(135, 120, 155, 0.4);
        }
        .menu-card:last-child:hover {
            background: rgba(145, 130, 165, 0.5);
        }

        .divider-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 1px;
            background: rgba(200, 180, 140, 0.5);
            position: relative;
        }

        .divider-logo {
            width: 48px;
            height: 48px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            opacity: 0.7;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .menu-card {
                font-size: 0.9rem;
                letter-spacing: 1.5px;
            }
            .divider-logo {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="menu-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <span class="menu-title">世界心學會</span>
    </div>

    <div class="menu-body">
        <a href="知足天律.html" class="menu-card">知足天律</a>

        <div class="divider-zone">
            <img class="divider-logo" src="Tusita.png" alt="Tusita">
        </div>

        <a href="心學.html" class="menu-card">心學</a>
    </div>

</body>
</html>
