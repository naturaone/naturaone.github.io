<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            flex: 1;
            display: flex;
            position: relative;
        }

        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            font-size: 1.3rem;
            letter-spacing: 3px;
            position: relative;
        }

        .menu-card:first-child {
            background: rgba(88, 66, 103, 0.04);
        }
        .menu-card:first-child:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .menu-card:last-child {
            background: rgba(88, 66, 103, 0.02);
        }
        .menu-card:last-child:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        .card-text {
            position: relative;
            z-index: 1;
        }

        .handle-left {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            object-fit: contain;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .menu-card:first-child .handle-left {
            right: -10px;
        }

        .menu-card:last-child .handle-left {
            left: -10px;
        }

        .divider-zone {
            width: 1px;
            background: rgba(88, 66, 103, 0.2);
            position: relative;
            z-index: 1;
        }

        .left-edge {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: auto;
            height: 100%;
            max-width: 18vw;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .right-edge {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: auto;
            height: 100%;
            max-width: 18vw;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .menu-card {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .handle-left {
                width: 55px;
                height: 55px;
            }
            .menu-card:first-child .handle-left {
                right: -5px;
            }
            .menu-card:last-child .handle-left {
                left: -5px;
            }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
            .left-edge {
                max-width: 14vw;
            }
            .right-edge {
                max-width: 14vw;
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界心學會</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="left-edge" src="左門邊.png" alt="">

        <a href="知足天律.html" class="menu-card">
            <img class="handle-left" src="把手.png" alt="">
            <span class="card-text">知足天律</span>
        </a>

        <div class="divider-zone"></div>

        <a href="心學.html" class="menu-card">
            <img class="handle-left" src="把手.png" alt="">
            <span class="card-text">心學</span>
        </a>

        <img class="right-edge" src="右門邊.png" alt="">

    </div>

</body>
</html>
