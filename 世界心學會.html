<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            flex: 1;
            display: flex;
            position: relative;
        }

        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            font-size: 1.3rem;
            letter-spacing: 3px;
            position: relative;
        }

        .menu-card:first-child {
            background: rgba(88, 66, 103, 0.04);
            padding-right: 180px;
            /* 新增：讓內容靠右對齊，使文字+把手往中間移動 */
            justify-content: flex-end;
        }
        .menu-card:first-child:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .menu-card:last-child {
            background: rgba(88, 66, 103, 0.02);
            padding-left: 180px;
            /* 新增：讓內容靠左對齊，使文字+把手往中間移動 */
            justify-content: flex-start;
        }
        .menu-card:last-child:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        /* === 核心修改：把手定位方式 === */
        .card-text {
            position: relative;
            z-index: 1;
            /* 改為 inline-block，讓文字本身有確定的寬度邊界 */
            display: inline-block;
            /* 文字本身保持原樣 */
            font-size: inherit;
            letter-spacing: inherit;
        }

        /* 把手改為以 .card-text 為基準的絕對定位，圓心對齊文字中心 */
        .handle-left {
            position: absolute;
            /* 水平：放在文字容器正中央 */
            left: 50%;
            /* 垂直：放在文字容器正中央 */
            top: 50%;
            /* 把把手自身的中心點拉到定位點上 */
            transform: translate(-50%, -50%);
            width: 540px;
            height: 540px;
            object-fit: contain;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        /* 移除原本針對左右卡片把手的偏移設定，因為現在由 justify-content + padding 控制整體位置 */

        .divider-zone {
            width: 1px;
            background: rgba(88, 66, 103, 0.2);
            position: relative;
            z-index: 1;
        }

        /* === 恢復原本門邊尺寸 === */
        .left-edge {
            position: absolute;
            left: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .right-edge {
            position: absolute;
            right: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .menu-card {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .menu-card:first-child {
                padding-right: 50px;
                justify-content: flex-end;
            }
            .menu-card:last-child {
                padding-left: 50px;
                justify-content: flex-start;
            }
            .handle-left {
                width: 330px;
                height: 330px;
            }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
            .left-edge {
                max-width: 84vw;
                top: 38%;
            }
            .right-edge {
                max-width: 84vw;
                top: 38%;
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界心學會</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="left-edge" src="左門邊.png" alt="">

        <a href="知足天律.html" class="menu-card">
            <span class="card-text">
                <img class="handle-left" src="把手.png" alt="">
                知足天律
            </span>
        </a>

        <div class="divider-zone"></div>

        <a href="心學.html" class="menu-card">
            <span class="card-text">
                <img class="handle-left" src="把手.png" alt="">
                心學
            </span>
        </a>

        <img class="right-edge" src="右門邊.png" alt="">

    </div>

        <footer style="padding: 12px 20px; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(to bottom, #665078 0%, #584267 60%, #4a3558 100%); flex-shrink: 0;">
        <p style="font-size: 0.75rem; letter-spacing: 1px; color: #c5bbd4; font-weight: 300; margin: 0;">© 2023-2026 白頭翁</p>
    </footer>
    
</body>
</html>
