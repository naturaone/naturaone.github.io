<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>世界心學會 · 雙門</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f0ead8;
      font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #584267;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      margin: 0;
    }

    /* ---- 頂欄維持原風格 ---- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px 12px;
      background: linear-gradient(to bottom, #4a3558 0%, #584267 60%, #665078 100%);
      flex-direction: column;
      position: relative;
    }

    .header-logo {
      width: 56px;
      height: 56px;
      filter: invert(1) brightness(2);
      object-fit: contain;
      margin-bottom: 6px;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 350;
      letter-spacing: 4px;
      color: #dbd2e6;
    }

    .back-link {
      position: absolute;
      left: 24px;
      top: 22px;
      color: #dbd2e6;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 2px;
      border: 1px solid rgba(180, 165, 200, 0.5);
      padding: 5px 16px;
      transition: all 0.4s ease;
    }

    .back-link:hover {
      background: rgba(180, 165, 200, 0.2);
    }

    .home-link {
      position: absolute;
      right: 24px;
      top: 22px;
      color: #dbd2e6;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 2px;
      border: 1px solid rgba(180, 165, 200, 0.5);
      padding: 5px 16px;
      transition: all 0.4s ease;
    }

    .home-link:hover {
      background: rgba(180, 165, 200, 0.2);
    }

    /* ---- 主內容：雙門佈局 ---- */
    .menu-body {
      flex: 1;
      display: flex;
      position: relative;
      align-items: stretch; /* 讓兩扇門等高 */
    }

    /* 左右門邊裝飾 (純圖片，保持原有位置感) */
    .left-edge {
      position: absolute;
      left: 0;
      top: 43%;
      transform: translateY(-50%);
      width: auto;
      height: auto;
      max-width: 38vw;      /* 限制寬度，避免擠壓門扇 */
      max-height: 80vh;
      object-fit: contain;
      opacity: 0.5;
      z-index: 2;
      pointer-events: none;
    }

    .right-edge {
      position: absolute;
      right: 0;
      top: 43%;
      transform: translateY(-50%);
      width: auto;
      height: auto;
      max-width: 38vw;
      max-height: 80vh;
      object-fit: contain;
      opacity: 0.5;
      z-index: 2;
      pointer-events: none;
    }

    /* 兩扇門卡片：使用flex讓把手與文字組對齊 */
    .menu-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #584267;
      transition: background 0.5s ease;
      position: relative;
      /* 預留空間讓把手+文字可以自然置中，不再用硬padding */
      padding: 20px 10px;
      cursor: pointer;
    }

    /* 左門卡片 */
    .menu-card:first-child {
      background: rgba(88, 66, 103, 0.04);
      /* 將內容稍微往右推，使把手更靠近中間分隔線 */
      justify-content: flex-end;
      padding-right: 8%; /* 動態向中間靠攏 */
    }

    .menu-card:first-child:hover {
      background: rgba(88, 66, 103, 0.1);
    }

    /* 右門卡片 */
    .menu-card:last-child {
      background: rgba(88, 66, 103, 0.02);
      justify-content: flex-start;
      padding-left: 8%;
    }

    .menu-card:last-child:hover {
      background: rgba(88, 66, 103, 0.08);
    }

    /* ---- 把手+文字組合容器 ---- */
    .door-knob-group {
      display: flex;
      flex-direction: column;
      align-items: center;      /* 垂直置中：把手在上，文字在下 */
      justify-content: center;
      text-align: center;
      position: relative;
      /* 使整個組件自然對齊，把手圓心對齊文字中央 */
      gap: 4px;                /* 把手與文字之間微小間距，可依視覺調整 */
    }

    /* 把手圖片樣式 */
    .handle-img {
      display: block;
      width: 120px;            /* 調整把手大小，使其與文字比例和諧 */
      height: auto;
      object-fit: contain;
      opacity: 0.7;           /* 半透明保留材質感 */
      filter: drop-shadow(0 2px 4px rgba(88, 66, 103, 0.15));
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;   /* 點擊由父連結處理 */
      /* 確保圖片置中 */
      margin: 0 auto;
    }

    /* 滑鼠懸停時把手微動效果 */
    .menu-card:hover .handle-img {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* 標題文字 */
    .card-title {
      font-size: 1.4rem;
      font-weight: 350;
      letter-spacing: 4px;
      color: #584267;
      line-height: 1.3;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(240, 234, 216, 0.8);
      transition: color 0.3s ease;
    }

    .menu-card:hover .card-title {
      color: #3e2c4a;
    }

    /* 中間分隔線 (門縫) */
    .divider-zone {
      width: 1px;
      background: rgba(88, 66, 103, 0.25);
      position: relative;
      z-index: 3;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(88, 66, 103, 0.1);
    }

    /* 響應式調整 */
    @media (max-width: 768px) {
      .header-logo {
        width: 44px;
        height: 44px;
      }
      .header-title {
        font-size: 0.9rem;
        letter-spacing: 3px;
      }
      .back-link, .home-link {
        font-size: 0.75rem;
        padding: 4px 12px;
        left: 12px;
        top: 16px;
      }
      .home-link {
        left: auto;
        right: 12px;
      }

      .handle-img {
        width: 85px;
      }

      .card-title {
        font-size: 1.1rem;
        letter-spacing: 3px;
      }

      /* 手機上左右門仍向中間靠攏，但減少偏移量 */
      .menu-card:first-child {
        padding-right: 4%;
      }
      .menu-card:last-child {
        padding-left: 4%;
      }

      .left-edge {
        max-width: 45vw;
        top: 36%;
        opacity: 0.4;
      }
      .right-edge {
        max-width: 45vw;
        top: 36%;
        opacity: 0.4;
      }
    }

    @media (max-width: 480px) {
      .handle-img {
        width: 70px;
      }
      .card-title {
        font-size: 1rem;
        letter-spacing: 2px;
      }
      .menu-card:first-child {
        padding-right: 10px;
      }
      .menu-card:last-child {
        padding-left: 10px;
      }
    }
  </style>
</head>
<body>
<div class="site-header">
  <!-- 返回與首頁鏈接保持原有路徑 -->
  <a href="知足天之羽.html" class="back-link">← 返回</a>
  <img class="header-logo" src="Tusita.png" alt="Tusita 徽標">
  <span class="header-title">世界心學會</span>
  <a href="知足天.html" class="home-link">首頁</a>
</div>

<div class="menu-body">
  <!-- 左側門邊裝飾 (保留原有圖片) -->
  <img class="left-edge" src="左門邊.png" alt="">

  <!-- 左門：知足天律 -->
  <a href="知足天律.html" class="menu-card">
    <div class="door-knob-group">
      <!-- 把手圖片，圓心自然對齊上方文字區塊中央 -->
      <img class="handle-img" src="把手.png" alt="把手">
      <span class="card-title">知足天律</span>
    </div>
  </a>

  <!-- 中央門縫 -->
  <div class="divider-zone"></div>

  <!-- 右門：心學 -->
  <a href="心學.html" class="menu-card">
    <div class="door-knob-group">
      <img class="handle-img" src="把手.png" alt="把手">
      <span class="card-title">心學</span>
    </div>
  </a>

  <!-- 右側門邊裝飾 -->
  <img class="right-edge" src="右門邊.png" alt="">
</div>
</body>
</html>
