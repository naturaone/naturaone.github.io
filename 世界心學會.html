<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            font-size: 1.3rem;
            letter-spacing: 3px;
            position: relative;
        }

        .menu-card:first-child {
            background: rgba(88, 66, 103, 0.04);
            /* 整體向右靠攏，讓內容接近中間門縫 */
            justify-content: flex-end;
            padding-right: 120px;
        }
        .menu-card:first-child:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .menu-card:last-child {
            background: rgba(88, 66, 103, 0.02);
            /* 整體向左靠攏，讓內容接近中間門縫 */
            justify-content: flex-start;
            padding-left: 120px;
        }
        .menu-card:last-child:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        /* === 核心改動：把手的定位容器 === */
        .card-text {
            position: relative;
            z-index: 1;
            /* 關鍵：設定為 inline-block 讓文字有明確寬度，
               把手才能以此為基準做絕對定位 */
            display: inline-block;
            /* 給文字一些內邊距，讓把手有空間展示 */
            padding: 0;
            line-height: 1;
        }

        /* 把手圖片：以文字為基準做絕對定位，圓心對齊文字中心 */
        .handle-left {
            position: absolute;
            /* 水平居中：將把手左邊緣放在文字中心，再往回拉一半寬度 */
            left: 50%;
            /* 垂直居中：將把手上邊緣放在文字中心，再往回拉一半高度 */
            top: 50%;
            /* 關鍵：用 transform 讓把手本身的中心點對齊文字的 center */
            transform: translate(-50%, -50%);
            width: 540px;
            height: 540px;
            object-fit: contain;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .divider-zone {
            width: 1px;
            background: rgba(88, 66, 103, 0.2);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .left-edge {
            position: absolute;
            left: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .right-edge {
            position: absolute;
            right: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .menu-card {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .menu-card:first-child {
                padding-right: 40px;
            }
            .menu-card:last-child {
                padding-left: 40px;
            }
            .handle-left {
                width: 330px;
                height: 330px;
            }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
            .left-edge {
                max-width: 84vw;
                top: 38%;
            }
            .right-edge {
                max-width: 84vw;
                top: 38%;
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界心學會</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="left-edge" src="左門邊.png" alt="">

        <a href="知足天律.html" class="menu-card">
            <span class="card-text">
                <img class="handle-left" src="把手.png" alt="">
                知足天律
            </span>
        </a>

        <div class="divider-zone"></div>

        <a href="心學.html" class="menu-card">
            <span class="card-text">
                <img class="handle-left" src="把手.png" alt="">
                心學
            </span>
        </a>

        <img class="right-edge" src="右門邊.png" alt="">

    </div>

</body>
</html>
