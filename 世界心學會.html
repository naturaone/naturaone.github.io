<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            color: #584267;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px 12px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
            flex-direction: column;
            position: relative;
        }

        .header-logo {
            width: 56px;
            height: 56px;
            filter: invert(1) brightness(2);
            object-fit: contain;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 350;
            letter-spacing: 4px;
            color: #dbd2e6;
        }

        .back-link {
            position: absolute;
            left: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .back-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .home-link {
            position: absolute;
            right: 24px;
            top: 22px;
            color: #dbd2e6;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 1px solid rgba(180, 165, 200, 0.5);
            padding: 5px 16px;
            transition: all 0.4s ease;
        }

        .home-link:hover {
            background: rgba(180, 165, 200, 0.2);
        }

        .menu-body {
            flex: 1;
            display: flex;
            position: relative;
        }

        /* 恢復原本卡片基礎樣式，移除額外flex對齊，改由內部群組控制 */
        .menu-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.5s ease;
            text-decoration: none;
            color: #584267;
            font-size: 1.3rem;
            letter-spacing: 3px;
            position: relative;
        }

        /* 保持原始背景與padding設定，僅微調padding讓群組可向中間移動 */
        .menu-card:first-child {
            background: rgba(88, 66, 103, 0.04);
            padding-right: 180px;
            /* 靠右對齊，使內容往中間靠 */
            justify-content: flex-end;
        }
        .menu-card:first-child:hover {
            background: rgba(88, 66, 103, 0.1);
        }

        .menu-card:last-child {
            background: rgba(88, 66, 103, 0.02);
            padding-left: 180px;
            /* 靠左對齊，使內容往中間靠 */
            justify-content: flex-start;
        }
        .menu-card:last-child:hover {
            background: rgba(88, 66, 103, 0.08);
        }

        /* 新增：將把手與文字包在一個區塊內，垂直排列並居中對齊 */
        .door-group {
            display: flex;
            flex-direction: column;
            align-items: center;   /* 水平居中，確保把手圓心對齊文字中央 */
            justify-content: center;
            gap: 2px;             /* 把手與文字之間的細微間距，可依需求調整 */
            position: relative;
            z-index: 1;
        }

        /* 把手圖片：恢復原本尺寸為540px寬？但原設定是固定寬高，此處保留把手原尺寸設定，
           但為了在群組內正常顯示，移除絕對定位，改為相對位置，並繼承原尺寸 */
        .handle-left {
            display: block;
            width: 540px;
            height: 540px;
            object-fit: contain;
            opacity: 0.55;
            pointer-events: none;
            /* 移除絕對定位，讓它自然處於文字上方 */
            position: relative;
            /* 確保圖片本身居中 */
            margin: 0 auto;
            /* 原效果中有輕微移動，但現在由群組控制位置，不再需要left偏移 */
        }

        /* 文字樣式保持原設定 */
        .card-text {
            position: relative;
            z-index: 1;
            /* 確保文字在把手下方顯示 */
            display: block;
        }

        /* 保留原把手在左右卡片中的偏移設定，但現在由door-group整體移動，所以移除個別把手偏移 */
        /* 原本的 .menu-card:first-child .handle-left 與 last-child 的 left 設定移除，
           因為不再使用絕對定位，而是依賴群組對齊 */

        .divider-zone {
            width: 1px;
            background: rgba(88, 66, 103, 0.2);
            position: relative;
            z-index: 1;
        }

        .left-edge {
            position: absolute;
            left: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        .right-edge {
            position: absolute;
            right: 0;
            top: 43%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
        }

        /* 響應式保持原有尺寸規則 */
        @media (max-width: 768px) {
            .menu-card {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .menu-card:first-child {
                padding-right: 50px;
            }
            .menu-card:last-child {
                padding-left: 50px;
            }
            /* 手機上把手尺寸縮小，保持原設定 */
            .handle-left {
                width: 330px;
                height: 330px;
            }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }
            .left-edge {
                max-width: 84vw;
                top: 38%;
            }
            .right-edge {
                max-width: 84vw;
                top: 38%;
            }
        }
    </style>
</head>
<body>

    <div class="site-header">
        <a href="知足天之羽.html" class="back-link">← 返回</a>
        <img class="header-logo" src="Tusita.png" alt="Tusita">
        <span class="header-title">世界心學會</span>
        <a href="知足天.html" class="home-link">首頁</a>
    </div>

    <div class="menu-body">

        <img class="left-edge" src="左門邊.png" alt="">

        <!-- 左門卡片：使用 door-group 將把手與文字垂直排列 -->
        <a href="知足天律.html" class="menu-card">
            <div class="door-group">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">知足天律</span>
            </div>
        </a>

        <div class="divider-zone"></div>

        <!-- 右門卡片 -->
        <a href="心學.html" class="menu-card">
            <div class="door-group">
                <img class="handle-left" src="把手.png" alt="">
                <span class="card-text">心學</span>
            </div>
        </a>

        <img class="right-edge" src="右門邊.png" alt="">

    </div>

</body>
</html>
