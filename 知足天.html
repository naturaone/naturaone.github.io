<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知足天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Songti SC', 'Noto Serif SC', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #f0ead8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .bg-logo {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 145vw;
            height: 145vw;
            max-width: 1260px;
            max-height: 1260px;
            object-fit: contain;
            pointer-events: none;
            z-index: 0;
        }

        .manifesto {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #584267;
            line-height: 2.4;
            padding: 20px 20px;
        }

        @media (max-width: 768px) {
            .manifesto {
                font-size: 1.3rem;
                line-height: 2.2;
                padding: 10px 20px;
            }
            .bg-logo {
                width: 175vw;
                height: 175vw;
            }
        }
    </style>
</head>
<body onclick="location.href='知足天之羽.html'">

    <img class="bg-logo" src="知足天首頁.png" alt="Tusita">

    <p class="manifesto">
        這是一個沒有國別的世界<br>
        不分種族、貴賤、高低、信仰、貧富、性別等一切殊相<br>
        人人自主，為本真而活
    </p>

</body>
</html>
