<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>協會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #d8e8e0;
            color: #3d5e4e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 第一塊：機構名稱 ===== */
        .block-one {
            text-align: center;
            padding: 100px 20px 40px;
        }

        .org-name {
            font-size: 1.6rem;
            font-weight: 350;
            letter-spacing: 2px;
            color: #3d5e4e;
        }

        /* ===== 第二塊：宣言 ===== */
        .block-two {
            text-align: center;
            padding: 20px 20px 60px;
        }

        .manifesto {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            color: #5a7a68;
            line-height: 1.8;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(140, 185, 165, 0.5);
            margin: 30px auto 0;
        }

        /* ===== 第三塊：三大欄 ===== */
        .block-three {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            gap: 30px;
            flex: 1;
        }

        .portal-card {
            flex: 1;
            background: rgba(220, 235, 228, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(140, 185, 165, 0.25);
            padding: 50px 30px;
            text-align: center;
            text-decoration: none;
            color: #3d5e4e;
            transition: all 0.6s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 250px;
        }

        .portal-card:hover {
            background: rgba(200, 225, 215, 0.7);
            border-color: rgba(110, 165, 142, 0.45);
        }

        .portal-card h2 {
            font-size: 1.3rem;
            font-weight: 340;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .portal-card .arrow {
            font-size: 1.5rem;
            font-weight: 200;
            color: rgba(140, 185, 165, 0.6);
            margin-top: 15px;
            transition: all 0.6s ease;
        }

        .portal-card:hover .arrow {
            color: rgba(100, 155, 132, 0.8);
            transform: translateY(4px);
        }

        .portal-card .badge {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #5a7a68;
            border: 1px solid rgba(140, 185, 165, 0.4);
            padding: 4px 14px;
            margin-top: 10px;
        }

        /* ===== 第四塊：版權 ===== */
        .block-four {
            text-align: center;
            padding: 40px 20px;
            background: rgba(185, 210, 198, 0.5);
            border-top: 1px solid rgba(140, 185, 165, 0.2);
        }

        .copyright {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #5a7a68;
            font-weight: 300;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .block-three {
                flex-direction: column;
                padding: 20px 20px 60px;
                gap: 20px;
            }
            .portal-card {
                min-height: 180px;
                padding: 35px 25px;
            }
            .block-one {
                padding: 60px 20px 25px;
            }
            .org-name {
                font-size: 1.3rem;
            }
            .manifesto {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 第一塊：機構名稱 -->
    <section class="block-one">
        <h1 class="org-name">協會</h1>
    </section>

    <!-- 第二塊：宣言 -->
    <section class="block-two">
        <p class="manifesto">此處非喧囂之地，乃澄明之所。</p>
        <div class="divider"></div>
    </section>

    <!-- 第三塊：三大入口 -->
    <section class="block-three">
        
        <a href="left.html" class="portal-card">
            <h2>左</h2>
            <span class="arrow">→</span>
        </a>

        <a href="middle.html" class="portal-card">
            <h2>中</h2>
            <span class="badge">附 · 原著下載</span>
            <span class="arrow">→</span>
        </a>

        <a href="right.html" class="portal-card">
            <h2>右</h2>
            <span class="arrow">→</span>
        </a>

    </section>

    <!-- 第四塊：版權 -->
    <footer class="block-four">
        <p class="copyright">© 2025 協會 · 版權所有</p>
    </footer>

</body>
</html>
