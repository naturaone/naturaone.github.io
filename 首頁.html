<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界心學會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', 'Songti SC', serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        body {
            background-color: #584267;
            color: #dcd5e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 第一塊：黛紫從上往下漸變清透（0.5份） ===== */
        .block-one {
            flex: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 20px;
            background: linear-gradient(
                to bottom,
                #4a3558 0%,
                #584267 60%,
                #665078 100%
            );
        }

        .logo-img {
            width: 45px;
            height: 45px;
            margin-bottom: 8px;
            filter: invert(1)brightness(2);
        }

        .org-name {
            font-size: 1.5rem;
            font-weight: 350;
            letter-spacing: 3px;
            color: #dbd2e6;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(180, 165, 200, 0.5);
            margin: 10px auto 0;
        }

        /* ===== 第二塊：塗白 #f0ead8（3份） ===== */
        .block-two {
            flex: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: #f0ead8;
        }

        .manifesto {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #584267;
            line-height: 2.2;
        }

        .block-two .divider {
            width: 40px;
            height: 1px;
            background: rgba(88, 66, 103, 0.3);
            margin: 35px auto 0;
        }

        /* ===== 第三塊：左中右漸淡（1.5份） ===== */
        .block-three {
            flex: 1.5;
            display: flex;
            width: 100%;
        }

        .portal-card {
            flex: 1;
            border: none;
            border-right: 1px solid rgba(180, 165, 200, 0.15);
            text-decoration: none;
            color: #dcd5e0;
            transition: all 0.7s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .portal-card:last-child {
            border-right: none;
        }

        .portal-card.left-card {
            background: rgba(75, 55, 90, 0.5);
        }
        .portal-card.left-card:hover {
            background: rgba(85, 65, 100, 0.65);
        }

        .portal-card.middle-card {
            background: rgba(90, 70, 108, 0.45);
        }
        .portal-card.middle-card:hover {
            background: rgba(100, 80, 118, 0.6);
        }

        .portal-card.right-card {
            background: rgba(105, 85, 125, 0.4);
        }
        .portal-card.right-card:hover {
            background: rgba(115, 95, 135, 0.55);
        }

        .portal-card .portal-title {
            font-size: 1.2rem;
            font-weight: 340;
            letter-spacing: 3px;
            color: #e0d8ec;
        }

        /* ===== 第四塊：深黛半透明收尾（0.5份） ===== */
        .block-four {
            flex: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 20px;
            background: rgba(60, 45, 78, 0.7);
        }

        .copyright {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #c5bbd4;
            font-weight: 300;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .block-three {
                flex-direction: column;
            }
            .portal-card {
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid rgba(180, 165, 200, 0.15);
            }
            .portal-card:last-child {
                border-bottom: none;
            }
            .manifesto {
                font-size: 1.2rem;
                line-height: 2;
            }
            .org-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <section class="block-one">
        <img class="logo-img" src="natura.png" alt="世界心學會">
        <h1 class="org-name">世界心學會</h1>
        <div class="divider"></div>
    </section>

    <section class="block-two">
        <p class="manifesto">
            這是一個沒有國別的世界<br>
            不分種族、貴賤、高低、信仰、貧富、性別等一切殊相<br>
            人人自主，為本真而活
        </p>
        <div class="divider"></div>
    </section>

    <section class="block-three">
        <a href="知足天律.html" class="portal-card left-card">
            <span class="portal-title">知足天律</span>
        </a>
        <a href="心學.html" class="portal-card middle-card">
            <span class="portal-title">心學</span>
        </a>
        <a href="大同世界建造指南.html" class="portal-card right-card">
            <span class="portal-title">大同世界建造指南</span>
        </a>
    </section>

    <footer class="block-four">
        <p class="copyright">© 2023-2026 白頭翁</p>
    </footer>

</body>
</html>
